plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.horizon.android'
        minSdk providers.gradleProperty('minSdk').getOrElse('28').toInteger()
        targetSdk 35
        versionCode 19
        versionName '0.6.10'
        ndk { abiFilters providers.gradleProperty('abi').get() }
    }
    signingConfigs {
        development {
            storeFile file('../../.local/android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // Retain the existing installation's signing identity for upgrades.
            // Only the public certificate enters the APK; the key stays in .local/.
            signingConfig signingConfigs.development
        }
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android/gradle-jni']
        assets.srcDirs = ['../../.local/android/gradle-assets']
        res.srcDirs = ['res']
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
}
layout.buildDirectory = file('../../.local/android/gradle-build')
